name: Checagem do ambiente publico (sem APK)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ambiente.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ferramentas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar SDK disponivel no runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          "$ANDROID_HOME/build-tools/35.0.0/d8" --version
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" --version
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
      - name: Baixar Apktool no runner e verificar versao
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -sS -o "$RUNNER_TEMP/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          test -s "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" --version
      - name: Resultado
        run: echo 'Compilador publico preparado. Nenhum APK proprietario ou segredo foi usado.'
